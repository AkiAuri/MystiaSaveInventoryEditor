<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystia's Izakaya Save Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>Izakaya Save Editor</h1>
            <input type="file" id="saveUpload" accept=".memory,.json,.txt">
            <span id="status" class="status-text">Waiting for save file...</span>
        </div>
        <button id="exportBtn" class="btn" style="display: none;">Download Save</button>
    </div>

    <div class="tabs" id="tabContainer">
        <button class="tab-btn active" data-target="player">Player Profile</button>
        <button class="tab-btn" data-target="bonds">Bonds</button>
        <button class="tab-btn" data-target="merchants">Merchants</button>
        <button class="tab-btn" data-target="ingredients">Ingredients</button>
        <button class="tab-btn" data-target="beverages">Beverages</button>
        <button class="tab-btn" data-target="foods">Foods</button>
        <button class="tab-btn" data-target="cookers">Cookers</button>
        <button class="tab-btn" data-target="items">Items</button>
    </div>

    <div class="toolbar" id="toolbar" style="display: none; flex-direction: column; gap: 15px;">

        <!-- TOP ROW: Search, Sort & Add -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <!-- Filter Current -->
            <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 5px;">
                <label style="font-size: 12px; font-weight: bold; color: #666;">Filter Active Inventory</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="searchInput" class="search-bar" placeholder="Search Name, Tag, DLC..." style="flex: 2;">
                    <select id="sortSelect" class="search-bar" style="flex: 1; cursor: pointer;">
                        <option value="default">Sort: Default</option>
                        <option value="az">Sort: A-Z</option>
                        <option value="high">Sort: Highest Amount</option>
                        <option value="low">Sort: Lowest Amount</option>
                        <option value="dlc">Sort: By DLC</option>
                    </select>
                </div>
            </div>

            <!-- Find & Add New -->
            <div style="flex: 1.5; min-width: 350px; display: flex; flex-direction: column; gap: 5px;">
                <label style="font-size: 12px; font-weight: bold; color: #666;">Find & Add New Item</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="addSearchInput" class="search-bar" placeholder="Filter list..." style="flex: 1;">
                    <select id="addItemSelect" style="flex: 1.5; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="">-- Select an item to add --</option>
                    </select>
                    <button id="addItemBtn" class="btn">Add</button>
                </div>
            </div>
        </div>

        <!-- BOTTOM ROW: Mass Add & Purge -->
        <div style="display: flex; flex-direction: row; justify-content: space-between; gap: 5px; border-top: 1px solid #ddd; padding-top: 10px;">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label style="font-size: 12px; font-weight: bold; color: #666;">Mass Add to Existing (Ignores infinite/negative)</label>
                <div style="display: flex; gap: 8px; max-width: 300px;">
                    <input type="number" id="massAddAmount" class="search-bar" value="50" min="1" style="flex: 1;">
                    <button id="massAddBtn" class="btn btn-danger" style="white-space: nowrap;">Add to Existing</button>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-end;">
                <label style="font-size: 12px; font-weight: bold; color: #666;">Clean Up Save File</label>
                <button id="purgeZeroesBtn" class="btn" style="background-color: #607D8B; white-space: nowrap;">🗑Purge Items with 0 Amount</button>
            </div>
        </div>

    </div>

    <div class="item-grid" id="editorContainer"></div>
</div>

<!-- TOAST NOTIFICATION CONTAINER -->
<div id="toast-container"></div>

<script src="js/player.js"></script>
<script src="js/merchants.js"></script>
<script src="js/inventory.js"></script>
<script src="js/bonds.js"></script>
<script src="js/main.js"></script>

</body>
</html>
